<body class="selection:bg-pink-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- SOUND ENGINE (Web Audio API) ---
    let audioCtx = null;
    let isPlayingBg = false;
    let isMuted = false;

    function getAudioContext() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) audioCtx = new AudioContext();
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    const soundEffects = {
      playClick: () => {
        if (isMuted) return;
        try {
          const ctx = getAudioContext();
          if (!ctx) return;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(659.25, ctx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.12, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(); osc.stop(ctx.currentTime + 0.12);
        } catch (e) { }
      },
      playSuccess: () => {
        if (isMuted) return;
        try {
          const ctx = getAudioContext();
          if (!ctx) return;
          [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.08);
            gain.gain.setValueAtTime(0.18, ctx.currentTime + idx * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.08 + 0.3);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(ctx.currentTime + idx * 0.08);
            osc.stop(ctx.currentTime + idx * 0.08 + 0.3);
          });
        } catch (e) { }
      },
      playCelebration: () => {
        if (isMuted) return;
        try {
          const ctx = getAudioContext();
          if (!ctx) return;
          const chords = [
            [523.25, 659.25, 783.99], [587.33, 698.46, 880.00],
            [659.25, 783.99, 987.77], [1046.50, 1318.51, 1567.98]
          ];
          chords.forEach((chord, cIdx) => {
            chord.forEach(freq => {
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(freq, ctx.currentTime + cIdx * 0.18);
              gain.gain.setValueAtTime(0.15, ctx.currentTime + cIdx * 0.18);
              gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + cIdx * 0.18 + 0.5);
              osc.connect(gain); gain.connect(ctx.destination);
              osc.start(ctx.currentTime + cIdx * 0.18);
              osc.stop(ctx.currentTime + cIdx * 0.18 + 0.5);
            });
          });
        } catch (e) { }
      },
      startAmbient: () => {
        if (isPlayingBg) return;
        try {
          const ctx = getAudioContext();
          if (!ctx) return;
          isPlayingBg = true;
          let currentChord = 0;
          const padChords = [
            [349.23, 440.00, 523.25, 659.25],
            [440.00, 523.25, 659.25, 783.99],
            [261.63, 329.63, 392.00, 493.88]
          ];
          const cycle = () => {
            if (!isPlayingBg) return;
            const chord = padChords[currentChord];
            currentChord = (currentChord + 1) % padChords.length;
            chord.forEach(freq => {
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(freq, ctx.currentTime);
              gain.gain.setValueAtTime(0.001, ctx.currentTime);
              gain.gain.linearRampToValueAtTime(0.025, ctx.currentTime + 1.5);
              gain.gain.linearRampToValueAtTime(0.001, ctx.currentTime + 4.8);
              osc.connect(gain); gain.connect(ctx.destination);
              osc.start(ctx.currentTime);
              osc.stop(ctx.currentTime + 5.0);
            });
            if (isPlayingBg) setTimeout(cycle, 4800);
          };
          cycle();
        } catch (e) { }
      }
    };

    // --- BACKGROUND CANVAS ---
    function BackgroundCanvas() {
      const canvasRef = useRef(null);
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;
        const handleResize = () => {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', handleResize);

        const hearts = [];
        for (let i = 0; i < 30; i++) {
          hearts.push({
            x: Math.random() * width, y: Math.random() * height,
            size: Math.random() * 16 + 10, speedY: Math.random() * 0.6 + 0.3,
            swing: Math.random() * 2, swingSpeed: Math.random() * 0.02 + 0.01,
            color: ['#f43f5e', '#fb7185', '#fda4af', '#ff3366'][Math.floor(Math.random() * 4)],
            opacity: Math.random() * 0.5 + 0.3
          });
        }

        const drawHeart = (x, y, size, color, alpha) => {
          ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = color;
          ctx.beginPath();
          const top = size * 0.3;
          ctx.moveTo(x, y + top);
          ctx.bezierCurveTo(x, y, x - size / 2, y, x - size / 2, y + top);
          ctx.bezierCurveTo(x - size / 2, y + (size + top) / 2, x, y + size, x, y + size);
          ctx.bezierCurveTo(x, y + size, x + size / 2, y + (size + top) / 2, x + size / 2, y + top);
          ctx.bezierCurveTo(x + size / 2, y, x, y, x, y + top);
          ctx.closePath(); ctx.fill(); ctx.restore();
        };

        const render = () => {
          ctx.clearRect(0, 0, width, height);
          hearts.forEach(h => {
            h.y -= h.speedY; h.swing += h.swingSpeed;
            h.x += Math.sin(h.swing) * 0.5;
            if (h.y < -30) { h.y = height + 30; h.x = Math.random() * width; }
            drawHeart(h.x, h.y, h.size, h.color, h.opacity);
          });
          animationFrameId = requestAnimationFrame(render);
        };
        render();
        return () => {
          window.removeEventListener('resize', handleResize);
          cancelAnimationFrame(animationFrameId);
        };
      }, []);
      return <canvas ref={canvasRef} className="fixed inset-0 pointer-events-none z-0" />;
    }

    // --- MAIN APP COMPONENT ---
    function App() {
      const [stage, setStage] = useState(0);
      const [affectionScore, setAffectionScore] = useState(100);

      // Quiz State
      const [quizIdx, setQuizIdx] = useState(0);
      const [quizInputText, setQuizInputText] = useState('');
      const [quizSelectedOpt, setQuizSelectedOpt] = useState(null);
      const [quizFeedback, setQuizFeedback] = useState(false);
      const [quizError, setQuizError] = useState('');

      // Puzzle State
      const [puzzleTab, setPuzzleTab] = useState('memory');
      const [memoryCards, setMemoryCards] = useState([]);
      const [flippedCards, setFlippedCards] = useState([]);
      const [matchedCards, setMatchedCards] = useState([]);
      const [memorySolved, setMemorySolved] = useState(false);

      const [userScramble, setUserScramble] = useState('');
      const [usedScrambleBtns, setUsedScrambleBtns] = useState([]);
      const [scrambleSolved, setScrambleSolved] = useState(false);
      const [scrambleError, setScrambleError] = useState('');

      const [connectedNodes, setConnectedNodes] = useState([]);
      const [constellationSolved, setConstellationSolved] = useState(false);

      // Letter State
      const [typedLetter, setTypedLetter] = useState('');
      const [paragraphIdx, setParagraphIdx] = useState(0);
      const [isLetterDone, setIsLetterDone] = useState(false);

      // Confession State
      const [saidYes, setSaidYes] = useState(false);
      const [noPos, setNoPos] = useState({ position: 'static' });
      const [yesScale, setYesScale] = useState(1);
      const [showCert, setShowCert] = useState(false);

      const quizData = [
        {
          id: 1, type: 'input',
          question: "Hey Komala, what is the sweet nickname I always call you? 🙈💖",
          placeholder: "Type your sweet nickname here...",
          validAnswers: ["milu", "miluuuu", "Milu", "Miluuuu"],
          hint: "Hint: It starts with M and rhymes with love! 💖",
          sweetNote: "Correct! You are my one and only Miluuuu! 💕"
        },
        {
          id: 2, type: 'choice',
          question: "Where did we first see each other?",
          options: ["At a friend's birthday party 🎈", "At my sister's engagement 💍✨", "In a cute coffee shop ☕", "At a movie theater 🍿"],
          correctIndex: 1,
          sweetNote: "Yes! That sister's engagement was the day my life got so much brighter! 💖"
        },
        {
          id: 3, type: 'choice',
          question: "What was my very first opinion when I saw you?",
          options: ["Your cute outfit 👗", "Your beautiful, mesmerizing eyes 👀✨", "Your sweet smile 😊", "I was completely speechless ❤️"],
          correctIndex: 1,
          sweetNote: "Your eyes captured my heart right away, and they still do every single day! 💕"
        },
        {
          id: 4, type: 'choice',
          question: "What do I always say to you?",
          options: ["Stop getting angry so fast! 🙈😡", "You talk too much! 🗣️", "Buy me chocolates! 🍫", "Send me funny memes! 📲"],
          correctIndex: 0,
          sweetNote: "Haha true! Even when you get mad quickly, you are still the cutest person ever to me! 🥰"
        }
      ];

      const memoryCardDefs = [
        { id: 1, symbol: "💖", name: "Heart" }, { id: 2, symbol: "🌸", name: "Flower" },
        { id: 3, symbol: "🧸", name: "Teddy" }, { id: 4, symbol: "🍓", name: "Strawberry" },
        { id: 5, symbol: "👑", name: "Queen" }, { id: 6, symbol: "🍫", name: "Chocolate" }
      ];

      const constellationStars = [
        { id: 1, label: "Kind Soul", x: 50, y: 15 }, { id: 2, label: "Cutest Laugh", x: 80, y: 35 },
        { id: 3, label: "Warm Heart", x: 70, y: 75 }, { id: 4, label: "Pure Magic", x: 50, y: 90 },
        { id: 5, label: "Sweetest Smile", x: 30, y: 75 }, { id: 6, label: "My Favorite Person", x: 20, y: 35 }
      ];

      const careLetterParagraphs = [
        "Happy Birthday to the most amazing girl in the entire world! 🎂✨",
        "I want to tell you how deeply I admire the way you treat people around you. You are so genuinely sweet, caring, gentle, and respectful to everyone, bringing a soft warmth wherever you go. Seeing your beautiful soul in action makes me respect and adore you more and more every day.",
        "You hold the most irreplaceable, sacred place in my life. You aren't just my best friend—you are my safest comfort, my favorite text, the person who occupies my thoughts 24/7, and my absolute biggest crush.",
        "Even when you get angry quickly (hehe 🙈), you are still the absolute cutest human to me. I promise to always be by your side, to protect your smile, cheer for your dreams, and shower you with endless care.",
        "May your birthday be as sweet, radiant, and wonderful as you are! 💖"
      ];

      // Init Memory Cards
      useEffect(() => {
        const duplicated = [...memoryCardDefs, ...memoryCardDefs].map((c, idx) => ({ uniqueId: idx, ...c }));
        setMemoryCards(duplicated.sort(() => Math.random() - 0.5));
      }, []);

      // Typewriter Letter Effect
      useEffect(() => {
        if (stage !== 3 || isLetterDone) return;
        if (paragraphIdx >= careLetterParagraphs.length) {
          setIsLetterDone(true); return;
        }
        const currP = careLetterParagraphs[paragraphIdx];
        let cIdx = 0;
        const interval = setInterval(() => {
          if (cIdx < currP.length) {
            setTypedLetter(prev => prev + currP[cIdx]);
            cIdx++;
          } else {
            clearInterval(interval);
            setTimeout(() => {
              setTypedLetter(prev => prev + '\n\n');
              setParagraphIdx(prev => prev + 1);
            }, 350);
          }
        }, 20);
        return () => clearInterval(interval);
      }, [stage, paragraphIdx, isLetterDone]);

      const handleUnseal = () => {
        soundEffects.playClick();
        soundEffects.startAmbient();
        setStage(1);
      };

      // Quiz Handlers
      const handleQuizSubmitInput = (e) => {
        e.preventDefault();
        if (quizFeedback) return;
        const trimmed = quizInputText.trim().toLowerCase();
        if (trimmed.includes('milu') || trimmed.includes('miluuuu')) {
          soundEffects.playSuccess();
          setQuizError(''); setQuizFeedback(true);
          setAffectionScore(s => s + 100);
        } else {
          soundEffects.playClick();
          setQuizError("Hint: Try typing 'Milu' or 'Miluuuu' 💖");
        }
      };

      const handleQuizSelectOption = (idx) => {
        if (quizFeedback) return;
        soundEffects.playClick();
        setQuizSelectedOpt(idx);
        setQuizFeedback(true);
        soundEffects.playSuccess();
        setAffectionScore(s => s + 100);
      };

      const handleQuizNext = () => {
        soundEffects.playClick();
        setQuizFeedback(false);
        setQuizSelectedOpt(null);
        setQuizInputText('');
        setQuizError('');
        if (quizIdx < quizData.length - 1) {
          setQuizIdx(i => i + 1);
        } else {
          setStage(2);
        }
      };

      // Puzzle Handlers
      const handleCardClick = (idx) => {
        if (flippedCards.length === 2 || flippedCards.includes(idx)) return;
        soundEffects.playClick();
        const newFlipped = [...flippedCards, idx];
        setFlippedCards(newFlipped);
        if (newFlipped.length === 2) {
          const [i1, i2] = newFlipped;
          if (memoryCards[i1].id === memoryCards[i2].id) {
            soundEffects.playSuccess();
            const newMatched = [...matchedCards, memoryCards[i1].id];
            setMatchedCards(newMatched);
            setFlippedCards([]);
            setAffectionScore(s => s + 50);
            if (newMatched.length === memoryCardDefs.length) {
              setMemorySolved(true); soundEffects.playCelebration();
            }
          } else {
            setTimeout(() => setFlippedCards([]), 800);
          }
        }
      };

      const handleScrambleBtnClick = (char, btnIdx) => {
        if (usedScrambleBtns.includes(btnIdx) || scrambleSolved) return;
        soundEffects.playClick();
        const newWord = userScramble + char;
        const newUsed = [...usedScrambleBtns, btnIdx];
        setUserScramble(newWord); setUsedScrambleBtns(newUsed);
        setScrambleError('');
        if (newWord.length === 7) {
          if (newWord.toUpperCase() === "MILUUUU") {
            soundEffects.playCelebration(); setScrambleSolved(true);
            setAffectionScore(s => s + 150);
          } else {
            soundEffects.playClick();
            setScrambleError("Almost! Tap Clear to try again 💖");
          }
        }
      };

      const handleResetScramble = () => {
        soundEffects.playClick();
        setUserScramble(''); setUsedScrambleBtns([]); setScrambleError('');
      };

      const handleNodeClick = (id) => {
        if (constellationSolved) return;
        soundEffects.playClick();
        if (!connectedNodes.includes(id)) {
          const newConn = [...connectedNodes, id];
          setConnectedNodes(newConn);
          if (newConn.length === constellationStars.length) {
            soundEffects.playCelebration();
            setConstellationSolved(true);
            setAffectionScore(s => s + 150);
          }
        }
      };

      const handleNoHover = () => {
        soundEffects.playClick();
        const rx = Math.floor(Math.random() * 60) + 20;
        const ry = Math.floor(Math.random() * 60) + 20;
        setNoPos({ position: 'fixed', left: `${rx}%`, top: `${ry}%`, zIndex: 50 });
        setYesScale(s => Math.min(s + 0.15, 2.0));
      };

      const handleYesClick = () => {
        soundEffects.playCelebration();
        setSaidYes(true);
        if (window.confetti) {
          window.confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
        }
      };

      const currQ = quizData[quizIdx];
      const allPuzzlesSolved = memorySolved && scrambleSolved && constellationSolved;

      return (
        <div className="min-h-screen relative z-10 p-4">
          <BackgroundCanvas />

          {/* Top Header */}
          {stage > 0 && (
            <div className="fixed top-4 left-1/2 transform -translate-x-1/2 z-40 w-11/12 max-w-xl glass-card px-4 py-2.5 rounded-full flex items-center justify-between shadow-2xl">
              <div className="flex items-center space-x-3 text-xs font-bold">
                <span className={stage === 1 ? 'text-white' : 'text-pink-300/60'}>1. Quiz</span>
                <span className={stage === 2 ? 'text-white' : 'text-pink-300/60'}>2. Puzzles</span>
                <span className={stage === 3 ? 'text-white' : 'text-pink-300/60'}>3. Care Note</span>
                <span className={stage === 4 ? 'text-white' : 'text-pink-300/60'}>4. Confession</span>
              </div>
              <div className="flex items-center space-x-1 bg-pink-900/60 px-3 py-1 rounded-full text-xs font-bold text-pink-100">
                <span>✨ {affectionScore} 💕</span>
              </div>
            </div>
          )}

          {/* STAGE 0: Entrance */}
          {stage === 0 && (
            <div className="min-h-screen flex flex-col items-center justify-center text-center space-y-6 max-w-md mx-auto">
              <div className="space-y-2 animate-float">
                <span className="bg-pink-500/20 border border-pink-400/30 px-3.5 py-1 rounded-full text-xs font-bold text-pink-200 uppercase">
                  Exclusive Birthday Experience
                </span>
                <h1 className="text-4xl sm:text-6xl font-extrabold text-pink-gradient font-display">
                  Happy Birthday <br />
                  <span className="font-serif text-5xl sm:text-7xl text-rose-300 font-normal">
                    Komala (Miluuuu) 💕
                  </span>
                </h1>
                <p className="text-xs sm:text-sm text-pink-200/80">
                  A magical journey created with love, just for you Miluuuu on your special day ✨
                </p>
              </div>

              {/* Envelope Box */}
              <div
                onClick={handleUnseal}
                className="w-full h-64 glass-card rounded-3xl p-6 flex flex-col items-center justify-between border-2 border-pink-400/40 shadow-2xl cursor-pointer transform hover:scale-105 transition-all group"
              >
                <div className="w-16 h-16 rounded-full bg-gradient-to-tr from-pink-600 to-rose-500 flex items-center justify-center text-3xl shadow-xl mt-4">
                  💖
                </div>
                <div className="text-center space-y-1">
                  <p className="font-script text-2xl text-pink-100">Sealed With Pure Love & Care</p>
                  <p className="text-xs text-pink-300/70">Tap anywhere on the envelope to unseal 💌</p>
                </div>
                <span className="text-xs text-pink-400 font-bold">Unseal Your Surprise ➡️</span>
              </div>
            </div>
          )}

          {/* STAGE 1: Quiz */}
          {stage === 1 && (
            <div className="min-h-screen flex flex-col items-center justify-center max-w-xl mx-auto pt-16 space-y-6">
              <div className="text-center space-y-1">
                <span className="text-xs font-bold bg-pink-500/20 px-3 py-1 rounded-full text-pink-300">
                  Stage 1: Memory & Friendship Quiz
                </span>
                <h2 className="text-3xl font-extrabold text-pink-gradient font-display">
                  How Well Do You Know Us? 💖
                </h2>
                <p className="text-xs text-pink-200/70">Question {quizIdx + 1} of {quizData.length}</p>
              </div>

              <div className="glass-card p-6 sm:p-8 rounded-3xl w-full space-y-6 border border-pink-400/30">
                <h3 className="text-xl font-bold text-pink-100">{currQ.question}</h3>

                {currQ.type === 'input' && (
                  <form onSubmit={handleQuizSubmitInput} className="space-y-3">
                    <input
                      type="text"
                      value={quizInputText}
                      onChange={e => setQuizInputText(e.target.value)}
                      disabled={quizFeedback}
                      placeholder={currQ.placeholder}
                      className="w-full px-4 py-3.5 rounded-2xl bg-pink-950/60 border-2 border-pink-400/40 text-pink-50 font-bold text-lg focus:outline-none placeholder-pink-300/40"
                    />
                    {!quizFeedback && (
                      <button type="submit" className="w-full py-3 rounded-xl bg-gradient-to-r from-pink-500 to-rose-600 font-bold text-white shadow-lg">
                        Unlock 🔑
                      </button>
                    )}
                    {quizError && !quizFeedback && (
                      <p className="text-xs text-rose-300 font-semibold animate-pulse">{quizError}</p>
                    )}
                  </form>
                )}

                {currQ.type === 'choice' && (
                  <div className="space-y-3">
                    {currQ.options.map((opt, idx) => (
                      <button
                        key={idx}
                        onClick={() => handleQuizSelectOption(idx)}
                        disabled={quizFeedback}
                        className={`w-full p-4 rounded-2xl text-left font-semibold text-sm transition-all border ${quizSelectedOpt === idx
                          ? 'bg-gradient-to-r from-pink-600 to-rose-600 text-white border-pink-300 shadow-lg'
                          : 'bg-pink-950/40 text-pink-100 hover:bg-pink-900/50 border-pink-500/20'
                          }`}
                      >
                        {opt}
                      </button>
                    ))}
                  </div>
                )}

                {quizFeedback && (
                  <div className="p-4 rounded-2xl bg-pink-900/80 border border-pink-400/50 space-y-1 animate-float">
                    <p className="text-xs font-bold text-pink-300">Sweet Secret Feedback! (+100 💕)</p>
                    <p className="font-script text-xl text-pink-100">{currQ.sweetNote}</p>
                  </div>
                )}

                {quizFeedback && (
                  <button onClick={handleQuizNext} className="w-full py-4 rounded-2xl bg-gradient-to-r from-rose-500 to-pink-600 text-white font-bold text-base shadow-xl">
                    {quizIdx < quizData.length - 1 ? 'Next Sweet Question ➡️' : 'Unlock Easy Mini-Puzzles 🧩'}
                  </button>
                )}
              </div>
            </div>
          )}

          {/* STAGE 2: Puzzles */}
          {stage === 2 && (
            <div className="min-h-screen flex flex-col items-center justify-center max-w-xl mx-auto pt-16 space-y-6">
              <div className="text-center space-y-1">
                <span className="text-xs font-bold bg-pink-500/20 px-3 py-1 rounded-full text-pink-300">
                  Stage 2: Romantic Mini-Puzzles
                </span>
                <h2 className="text-3xl font-extrabold text-pink-gradient font-display">Keys to My Heart 🔐</h2>
              </div>

              {/* Tabs */}
              <div className="flex w-full bg-pink-950/60 p-1 rounded-full border border-pink-500/20 text-xs font-bold">
                <button onClick={() => setPuzzleTab('memory')} className={`flex-1 py-2 rounded-full ${puzzleTab === 'memory' ? 'bg-pink-600 text-white' : 'text-pink-300/70'}`}>
                  1. Pairs {memorySolved && '✓'}
                </button>
                <button onClick={() => setPuzzleTab('scramble')} className={`flex-1 py-2 rounded-full ${puzzleTab === 'scramble' ? 'bg-pink-600 text-white' : 'text-pink-300/70'}`}>
                  2. Love Lock {scrambleSolved && '✓'}
                </button>
                <button onClick={() => setPuzzleTab('constellation')} className={`flex-1 py-2 rounded-full ${puzzleTab === 'constellation' ? 'bg-pink-600 text-white' : 'text-pink-300/70'}`}>
                  3. Star Heart {constellationSolved && '✓'}
                </button>
              </div>

              <div className="glass-card p-6 rounded-3xl w-full min-h-[380px] flex flex-col justify-between border border-pink-400/30">
                {/* Memory Game */}
                {puzzleTab === 'memory' && (
                  <div className="space-y-4 text-center">
                    <p className="text-xs text-pink-200 font-semibold">Match all 6 romantic card pairs 💖</p>
                    <div className="grid grid-cols-4 gap-3">
                      {memoryCards.map((c, idx) => {
                        const isFlipped = flippedCards.includes(idx) || matchedCards.includes(c.id);
                        return (
                          <button
                            key={c.uniqueId}
                            onClick={() => handleCardClick(idx)}
                            disabled={isFlipped || memorySolved}
                            className={`h-20 rounded-2xl flex flex-col items-center justify-center text-2xl border transition-all ${isFlipped ? 'bg-gradient-to-tr from-pink-600 to-rose-500 text-white border-pink-200' : 'bg-pink-950/60 border-pink-500/30'
                              }`}
                          >
                            {isFlipped ? <span>{c.symbol}</span> : <span className="opacity-40">💖</span>}
                          </button>
                        );
                      })}
                    </div>
                  </div>
                )}

                {/* Scramble Game */}
                {puzzleTab === 'scramble' && (
                  <div className="space-y-6 text-center">
                    <p className="text-xs text-pink-300">Unscramble the sweetest 7-letter nickname 🔐💗</p>
                    <div className="p-4 rounded-2xl bg-pink-950/80 border-2 border-pink-400/50 min-h-[60px] flex items-center justify-center">
                      <span className="text-3xl font-extrabold tracking-widest text-pink-gradient">{userScramble || "..."}</span>
                    </div>
                    <div className="flex flex-wrap justify-center gap-2">
                      {["U", "I", "M", "L", "U", "U", "U"].map((char, btnIdx) => {
                        const isUsed = usedScrambleBtns.includes(btnIdx);
                        return (
                          <button
                            key={btnIdx}
                            onClick={() => handleScrambleBtnClick(char, btnIdx)}
                            disabled={isUsed || scrambleSolved}
                            className={`w-12 h-12 rounded-xl text-lg font-extrabold border ${isUsed ? 'bg-pink-950/40 text-pink-500/30 border-pink-900/30' : 'bg-gradient-to-r from-pink-600 to-rose-500 text-white border-pink-300/40'
                              }`}
                          >
                            {char}
                          </button>
                        );
                      })}
                    </div>
                    {!scrambleSolved && userScramble && (
                      <button onClick={handleResetScramble} className="text-xs text-pink-300 underline">Clear & Try Again</button>
                    )}
                    {scrambleSolved && <p className="text-sm text-emerald-300 font-bold">Unlocked: "MILUUUU" 💕</p>}
                  </div>
                )}

                {/* Constellation Game */}
                {puzzleTab === 'constellation' && (
                  <div className="space-y-4 text-center">
                    <p className="text-xs text-pink-300">Tap all 6 stars to connect your glowing heart constellation ✨</p>
                    <div className="relative w-full h-56 rounded-2xl bg-slate-950/90 border border-pink-500/30 overflow-hidden">
                      <svg className="absolute inset-0 w-full h-full pointer-events-none" viewBox="0 0 100 100" preserveAspectRatio="none">
                        {connectedNodes.map((id, idx) => {
                          if (idx === 0) return null;
                          const p1 = constellationStars.find(n => n.id === connectedNodes[idx - 1]);
                          const p2 = constellationStars.find(n => n.id === id);
                          return <line key={idx} x1={p1.x} y1={p1.y} x2={p2.x} y2={p2.y} stroke="#f43f5e" strokeWidth="1.5" strokeDasharray="2" />;
                        })}
                      </svg>
                      {constellationStars.map(s => {
                        const isConn = connectedNodes.includes(s.id);
                        return (
                          <button
                            key={s.id}
                            onClick={() => handleNodeClick(s.id)}
                            style={{ left: `${s.x}%`, top: `${s.y}%` }}
                            className={`absolute transform -translate-x-1/2 -translate-y-1/2 p-2 rounded-full text-xs font-bold transition-all ${isConn ? 'bg-pink-500 text-white scale-125' : 'bg-pink-950 text-pink-300 border border-pink-400/40'
                              }`}
                          >
                            ⭐ <span className="block text-[9px]">{s.label}</span>
                          </button>
                        );
                      })}
                    </div>
                    {constellationSolved && <p className="text-sm text-emerald-300 font-bold">Constellation Complete! ✨</p>}
                  </div>
                )}

                {allPuzzlesSolved && (
                  <button onClick={() => { soundEffects.playCelebration(); setStage(3); }} className="w-full mt-4 py-4 rounded-2xl bg-gradient-to-r from-pink-500 to-rose-600 text-white font-extrabold text-base shadow-xl">
                    Unlock Note of Pure Care ➡️
                  </button>
                )}
              </div>
            </div>
          )}

          {/* STAGE 3: Care Note */}
          {stage === 3 && (
            <div className="min-h-screen flex flex-col items-center justify-center max-w-2xl mx-auto pt-16 space-y-6 pb-16">
              <div className="text-center space-y-1">
                <span className="text-xs font-bold bg-pink-500/20 px-3 py-1 rounded-full text-pink-300">
                  Stage 3: Pure Form of Care
                </span>
                <h2 className="text-4xl font-extrabold text-pink-gradient font-display">From My Heart To Yours 💌</h2>
              </div>

              <div className="glass-card p-6 sm:p-10 rounded-3xl border-2 border-pink-400/30 w-full space-y-6">
                <div className="flex items-center justify-between border-b border-pink-500/20 pb-4">
                  <span className="font-script text-xl text-pink-200">A Letter From My Heart To Yours 💌</span>
                  {!isLetterDone && (
                    <button onClick={() => { setTypedLetter(careLetterParagraphs.join('\n\n')); setIsLetterDone(true); }} className="text-xs bg-pink-900/40 px-3 py-1 rounded-full text-pink-300 border border-pink-400/30">
                      Show Full Letter ⚡
                    </button>
                  )}
                </div>

                <div className="font-handwriting text-2xl sm:text-3xl text-pink-100 leading-relaxed space-y-4">
                  <p className="font-script text-2xl font-bold text-pink-300">Heyy Miluuuu 💕,</p>
                  <p className="whitespace-pre-line font-medium text-pink-50/90">{typedLetter}</p>
                  {isLetterDone && (
                    <div className="pt-4 border-t border-pink-500/20">
                      <p className="text-xl font-script text-pink-300">With all my heart & care,</p>
                      <p className="text-3xl font-handwriting text-rose-300 font-bold">I 💖 You!</p>
                    </div>
                  )}
                </div>
              </div>

              <button onClick={() => { soundEffects.playCelebration(); setStage(4); }} className="w-full py-4 rounded-2xl bg-gradient-to-r from-pink-500 via-rose-500 to-rose-600 text-white font-extrabold text-lg shadow-xl">
                The Most Important Moment ("The Question of Today") ➡️
              </button>
            </div>
          )}

          {/* STAGE 4: Confession */}
          {stage === 4 && (
            <div className="min-h-screen flex flex-col items-center justify-center max-w-xl mx-auto pt-16 text-center space-y-6">
              <span className="text-xs font-bold bg-pink-500/20 px-4 py-1 rounded-full text-pink-300">
                The Special Moment ✨
              </span>

              <div className="w-24 h-24 rounded-full bg-gradient-to-tr from-pink-600 to-rose-500 flex items-center justify-center text-5xl shadow-2xl mx-auto animate-heartbeat">
                💖
              </div>

              <div className="space-y-2">
                <h2 className="text-3xl sm:text-5xl font-extrabold text-pink-gradient font-display">
                  Today on your birthday Miluuuu, there's one question I must ask...
                </h2>
                <p className="text-sm text-pink-200/80 max-w-md mx-auto">
                  We've shared so many laughs, memories, and unspoken feelings. My heart has chosen you, and I want to ask you directly today.
                </p>
              </div>

              <div className="glass-card p-6 sm:p-8 rounded-3xl border-2 border-pink-400/40 w-full space-y-6">
                <p className="font-script text-3xl text-rose-200 font-bold">
                  "Will you give us a chance to turn this beautiful bond into something even more special & romantic?"
                </p>

                {!saidYes ? (
                  <div className="flex flex-col sm:flex-row items-center justify-center gap-4 pt-4 relative min-h-[100px]">
                    <button
                      onClick={handleYesClick}
                      style={{ transform: `scale(${yesScale})` }}
                      className="w-full sm:w-auto px-10 py-5 rounded-full bg-gradient-to-r from-pink-500 via-rose-500 to-rose-600 text-white font-extrabold text-xl shadow-2xl hover:scale-105 transition-all border-2 border-pink-200"
                    >
                      YES! 💖 I'd love that so much!
                    </button>
                    <button
                      onMouseEnter={handleNoHover} onTouchStart={handleNoHover} onClick={handleNoHover}
                      style={noPos}
                      className="px-6 py-3 rounded-full bg-slate-900/80 text-pink-300 text-sm border border-pink-500/30"
                    >
                      No 😜
                    </button>
                  </div>
                ) : (
                  <div className="space-y-4 pt-4 animate-float">
                    <div className="p-6 rounded-2xl bg-gradient-to-tr from-pink-900/80 to-rose-900/80 border-2 border-pink-300 space-y-3">
                      <h3 className="text-2xl font-extrabold text-pink-100">YOU SAID YES MILUUUU! 🎆💖✨</h3>
                      <p className="text-sm text-pink-200">This is officially the happiest day of my life! Happy Birthday, my love!</p>
                      <button onClick={() => setShowCert(true)} className="px-6 py-2.5 rounded-full bg-white text-rose-600 font-bold text-xs">
                        View Official Love Certificate
                      </button>
                    </div>
                  </div>
                )}
              </div>

              {/* Certificate Modal */}
              {showCert && (
                <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
                  <div className="glass-card max-w-lg w-full p-8 rounded-3xl border-4 border-rose-400 text-center space-y-6 bg-slate-950">
                    <h3 className="text-2xl font-extrabold text-gold-pink-gradient font-display">OFFICIAL CERTIFICATE OF LOVE & HAPPINESS</h3>
                    <p className="text-sm text-pink-200/90 leading-relaxed font-sans">
                      This certifies that on this special day, Komala (Miluuuu) and her favorite person connected to embark on a beautiful romantic journey filled with love, laughter, and endless care.
                    </p>
                    <div className="grid grid-cols-2 gap-4 border-t border-pink-500/30 pt-4">
                      <div>
                        <span className="text-[10px] text-pink-400 uppercase">Recipient</span>
                        <p className="font-handwriting text-2xl text-pink-100 font-bold">Komala (Miluuuu)</p>
                      </div>
                      <div>
                        <span className="text-[10px] text-pink-400 uppercase">Sender</span>
                        <p className="font-handwriting text-2xl text-pink-100 font-bold">Yours Always</p>
                      </div>
                    </div>
                    <button onClick={() => setShowCert(false)} className="w-full py-3 rounded-full bg-pink-600 text-white font-bold text-sm">
                      Close & Keep Loving 💖
                    </button>
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>

</html>
